<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIRMS HARMONY · Unified Satellite Fire Intelligence</title>
<meta name="description" content="Unified satellite fire intelligence harmonizing NASA FIRMS MODIS and VIIRS observations along the Nile Valley and Delta, Egypt.">
<meta name="theme-color" content="#050B18">
<link rel="icon" type="image/png" href="assets/firms-harmony-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home">
<canvas id="starfield" aria-hidden="true"></canvas>
<div class="cosmos-glow" aria-hidden="true"></div>

<a class="skip" id="skip" href="#main" data-i18n="skip"></a>

<header><div class="bar">
  <a class="logo" href="#home">
    <img src="assets/firms-harmony-icon.png" alt="FIRMS Harmony Logo" class="logo-img" width="36" height="36">
    <span class="logo-word"><b>FIRMS</b> HARMONY</span>
  </a>
  <nav id="nav" data-i18n-aria="nav_aria">
    <a href="#home" data-i18n="nav_home"></a>
    <a href="#map" data-i18n="nav_map"></a>
    <a href="#analytics" data-i18n="nav_analytics"></a>
    <a href="#sensors" data-i18n="nav_sensors"></a>
    <a href="#methodology" data-i18n="nav_method"></a>
    <a href="#about" data-i18n="nav_about"></a>
    <a href="./web/" title="Open Delta Fire Calendar (2000–2025)">Delta Calendar ↗</a>
  </nav>
  <button id="lang" class="lang" type="button" data-i18n-aria="lang_aria">العربية</button>
</div></header>

<main id="main" tabindex="-1">
<div class="bgimg" aria-hidden="true"></div>

<!-- HOME -->
<div class="page" id="home">
  <div class="wrap">
    <!-- SECTION 1: CINEMATIC HERO -->
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow"><i class="dot dot--cyan"></i><span data-i18n="hero_eyebrow"></span></div>
        <h1 class="hero-title" data-i18n="hero_title"></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="hero-actions">
          <a class="cta" href="#map"><span data-i18n="cta"></span><span class="arr" aria-hidden="true">→</span></a>
          <a class="cta-ghost" href="#methodology" data-i18n="how2012"></a>
        </div>
        <div class="stats" id="stats"></div>
        <p class="note note--gap" data-i18n="demo_note"></p>
      </div>
      <div id="heroSvg"></div>
    </section>

    <!-- SECTION 2: THE PROBLEM (MODIS vs VIIRS) -->
    <section class="sec reveal">
      <div class="sec-kicker" data-i18n="prob_kicker"></div>
      <h2 data-i18n="s_title"></h2>
      <p class="intro" data-i18n="s_intro"></p>
      <div class="sensors">
        <div class="sensor-card sensor-card--modis">
          <em data-i18n="since2000"></em>
          <h3>MODIS</h3>
          <p class="big" data-i18n="res_m"></p>
          <p data-i18n="modis_txt"></p>
        </div>
        <div class="sensor-card sensor-card--viirs">
          <em data-i18n="since2012"></em>
          <h3>VIIRS</h3>
          <p class="big" data-i18n="res_v"></p>
          <p data-i18n="viirs_txt"></p>
        </div>
      </div>
    </section>

    <!-- SECTION 3: THE HARMONIZATION PROCESS -->
    <section class="sec reveal">
      <div class="sec-kicker" data-i18n="proc_kicker"></div>
      <h2 data-i18n="proc_title"></h2>
      <p class="intro" data-i18n="proc_intro"></p>
      <div class="process-grid">
        <article class="proc-step">
          <span class="proc-num">01</span>
          <h3 data-i18n="p1_h"></h3>
          <p data-i18n="p1_p"></p>
        </article>
        <article class="proc-step">
          <span class="proc-num">02</span>
          <h3 data-i18n="p2_h"></h3>
          <p data-i18n="p2_p"></p>
        </article>
        <article class="proc-step">
          <span class="proc-num">03</span>
          <h3 data-i18n="p3_h"></h3>
          <p data-i18n="p3_p"></p>
        </article>
        <article class="proc-step">
          <span class="proc-num">04</span>
          <h3 data-i18n="p4_h"></h3>
          <p data-i18n="p4_p"></p>
        </article>
      </div>
    </section>

    <!-- SECTION 4: VERIFIED 2000–2025 ARCHIVE PROOF -->
    <section class="sec reveal">
      <div class="sec-kicker" data-i18n="ver_kicker"></div>
      <h2 data-i18n="ver_title"></h2>
      <p class="intro" data-i18n="ver_intro"></p>
      <div class="proof-grid">
        <div class="proof-card">
          <b class="proof-val proof-val--cyan">74</b>
          <span class="proof-lbl" data-i18n="pf1_l"></span>
          <small data-i18n="pf1_s"></small>
        </div>
        <div class="proof-card">
          <b class="proof-val">224,415</b>
          <span class="proof-lbl" data-i18n="pf2_l"></span>
          <small data-i18n="pf2_s"></small>
        </div>
        <div class="proof-card">
          <b class="proof-val proof-val--gold">−54.4%</b>
          <span class="proof-lbl" data-i18n="pf3_l"></span>
          <small data-i18n="pf3_s"></small>
        </div>
        <div class="proof-card">
          <b class="proof-val proof-val--orange">−54.5%</b>
          <span class="proof-lbl" data-i18n="pf4_l"></span>
          <small data-i18n="pf4_s"></small>
        </div>
      </div>
    </section>
  </div>

  <!-- SECTION 5: WHY IT MATTERS -->
  <section class="band reveal"><div class="wrap why">
    <div>
      <div class="sec-kicker" data-i18n="why_kicker"></div>
      <h2 data-i18n="why"></h2>
    </div>
    <div class="why-list">
      <div class="why-item"><h3 data-i18n="w1h"></h3><p data-i18n="w1p"></p></div>
      <div class="why-item"><h3 data-i18n="w2h"></h3><p data-i18n="w2p"></p></div>
      <div class="why-item"><h3 data-i18n="w3h"></h3><p data-i18n="w3p"></p></div>
    </div>
  </div></section>

  <!-- SECTION 6: FINAL CALL TO ACTION -->
  <div class="wrap">
    <section class="final-cta reveal">
      <div class="sec-kicker" data-i18n="fcta_kicker"></div>
      <h2 data-i18n="fcta_title"></h2>
      <p data-i18n="fcta_desc"></p>
      <div class="hero-actions" style="justify-content:center;">
        <a class="cta" href="#map"><span data-i18n="cta"></span><span class="arr" aria-hidden="true">→</span></a>
        <a class="cta-ghost" href="#analytics" data-i18n="fcta_btn2"></a>
      </div>
    </section>
  </div>
</div>

<!-- MAP -->
<div class="page" id="map"><div class="wrap"><h1 class="sr-only" data-i18n="nav_map"></h1><div class="mapgrid">
  <aside class="panel">
    <h2 data-i18n="f_title"></h2>
    <label><input type="checkbox" id="fM" checked> <span data-i18n="f_modis"></span></label>
    <label><input type="checkbox" id="fV" checked> <span data-i18n="f_viirs"></span></label>
    <div class="row" data-i18n="f_date"></div>
    <div class="yrs"><select id="y0" data-i18n-aria="y_from"></select><select id="y1" data-i18n-aria="y_to"></select></div>
    <div class="row"><span data-i18n="f_frp"></span> <b id="frpv">0 MW</b></div>
    <input type="range" id="frp" min="0" max="60" value="0" data-i18n-aria="f_frp">
    <div class="row" id="count" role="status"></div>
    <div class="row" data-i18n="f_scale"></div>
    <div class="ramp"></div>
    <div class="lg"><span data-i18n="low"></span><span data-i18n="high"></span></div>
    <p class="note note--gap" data-i18n="legend"></p>
    <p class="note" data-i18n="f_demo"></p>
  </aside>
  <div class="mapbox"><div id="mapCanvas"></div></div>
  <div class="panel" id="info" aria-live="polite"></div>
</div></div></div>

<!-- SPA VIEWS -->
<div class="page" id="analytics"><div class="wrap soon"><h1 class="page-title" data-i18n="an_h"></h1><p data-i18n="an_p"></p></div></div>
<div class="page" id="sensors"><div class="wrap soon"><h1 class="page-title" data-i18n="se_h"></h1><p data-i18n="se_p"></p></div></div>
<div class="page" id="methodology"><div class="wrap soon"><h1 class="page-title" data-i18n="me_h"></h1><p data-i18n="me_p"></p></div></div>
<div class="page" id="about"><div class="wrap soon"><h1 class="page-title" data-i18n="ab_h"></h1><p data-i18n="ab_p"></p></div></div>
</main>

<footer data-i18n="footer"></footer>

</body>
</html>
