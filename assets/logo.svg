<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Fire Harmony Logo">
  <defs>
    <!-- Deep nocturnal medallion backdrop -->
    <linearGradient id="fh-bg" x1="12%" y1="10%" x2="88%" y2="90%">
      <stop offset="0%" stop-color="#211711"/>
      <stop offset="55%" stop-color="#17110c"/>
      <stop offset="100%" stop-color="#0f252a"/>
    </linearGradient>

    <!-- Subtle outer ring gradient -->
    <linearGradient id="fh-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffd36a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3cc9b6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- MODIS-to-VIIRS thermal flame gradient -->
    <linearGradient id="fh-flame" x1="25%" y1="100%" x2="75%" y2="0%">
      <stop offset="0%" stop-color="#d83422"/>
      <stop offset="45%" stop-color="#ff5a4a"/>
      <stop offset="78%" stop-color="#f59a3d"/>
      <stop offset="100%" stop-color="#ffe07d"/>
    </linearGradient>

    <!-- Radiant inner thermal core -->
    <linearGradient id="fh-core" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff9d42"/>
      <stop offset="65%" stop-color="#ffe48f"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Nile River turquoise gradient -->
    <linearGradient id="fh-nile" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#176b69"/>
      <stop offset="55%" stop-color="#2fb8a6"/>
      <stop offset="100%" stop-color="#7ef0df"/>
    </linearGradient>

    <!-- Sweeping orbital trajectory gradient -->
    <linearGradient id="fh-orbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3cc9b6" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#3cc9b6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd36a" stop-opacity="1"/>
    </linearGradient>

    <!-- Ambient thermal glow -->
    <radialGradient id="fh-glow" cx="50%" cy="54%" r="42%">
      <stop offset="0%" stop-color="#ff5a4a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ff5a4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded app-icon medallion -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fh-bg)" stroke="url(#fh-rim)" stroke-width="1.5"/>

  <!-- Soft ambient thermal glow behind flame -->
  <circle cx="32" cy="35" r="22" fill="url(#fh-glow)"/>

  <!-- Back orbital arc (behind flame) -->
  <path d="M 10 42 C 7 33, 18 20, 34 15 C 45 11.5, 55 13, 55 19"
        fill="none" stroke="#3cc9b6" stroke-opacity="0.32" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Harmonized outer thermal flame silhouette -->
  <path d="M 32.5 11 C 32.5 11, 45.5 22.5, 45.5 34.8 C 45.5 43.2, 39.5 49.5, 32 49.5 C 24.5 49.5, 18.5 43.2, 18.5 34.8 C 18.5 27.6, 23.2 21.8, 25.4 18.8 C 25.6 22.4, 27.4 24.3, 28.8 24.8 C 28.2 19.2, 30.2 14.3, 32.5 11 Z"
        fill="url(#fh-flame)"/>

  <!-- Inner radiant heat core -->
  <path d="M 32 25.5 C 32 25.5, 39 32, 39 38.5 C 39 43.2, 35.9 46.8, 32 46.8 C 28.1 46.8, 25 43.2, 25 38.5 C 25 32.8, 32 25.5, 32 25.5 Z"
        fill="url(#fh-core)" opacity="0.92"/>

  <!-- Stylized Nile River & Delta carving smoothly through the base -->
  <path d="M 32 51.5 C 29.8 47.2, 34.4 43.2, 32 38.5 C 31.3 37.1, 29.5 34.8, 27.2 32.6 M 32 38.5 C 33.4 36.2, 35.1 34.2, 37.2 32.2"
        fill="none" stroke="#142b30" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 32 51.5 C 29.8 47.2, 34.4 43.2, 32 38.5 C 31.3 37.1, 29.5 34.8, 27.2 32.6 M 32 38.5 C 33.4 36.2, 35.1 34.2, 37.2 32.2"
        fill="none" stroke="url(#fh-nile)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front sweeping satellite orbit arc (crosses in front of flame) -->
  <path d="M 55 19 C 56 26, 44 37.5, 28 43.5 C 18 47.2, 11.5 46.8, 10 42"
        fill="none" stroke="url(#fh-orbit)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Satellite sensor node (MODIS/VIIRS orb) -->
  <circle cx="51.2" cy="17.2" r="5.2" fill="#ffd36a" opacity="0.22"/>
  <circle cx="51.2" cy="17.2" r="3" fill="#ffe07d" stroke="#17110c" stroke-width="1.2"/>
</svg>
