<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="FIRMS Harmony &amp; Delta Fire Calendar — NASA Space Apps 2026 Nile Delta MODIS and VIIRS Active-Fire Harmonization">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="48%" stop-color="#081224"/>
      <stop offset="100%" stop-color="#061c24"/>
    </linearGradient>
    <radialGradient id="nebulaFire" cx="15%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaNasa" cx="50%" cy="6%" r="44%">
      <stop offset="0%" stop-color="#1d6ef2" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaNile" cx="86%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="triadBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b1a"/>
      <stop offset="32%" stop-color="#f59e0b"/>
      <stop offset="66%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="82%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="nileGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="320" rx="20" fill="url(#spaceBg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#nebulaFire)"/>
  <rect width="1200" height="320" rx="20" fill="url(#nebulaNasa)"/>
  <rect width="1200" height="320" rx="20" fill="url(#nebulaNile)"/>
  <rect x="0" y="0" width="1200" height="3" rx="2" fill="url(#triadBar)" opacity="0.9"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#94c5ff" stroke-opacity="0.16"/>

  <!-- Subtle Cartographic Grid -->
  <g stroke="#94b3d6" stroke-opacity="0.055" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- Twinkling Deep-Space Stars -->
  <g fill="#e2e8f0">
    <circle cx="72" cy="48" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="195" cy="34" r="1.1" fill="#7dd3fc"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="42" r="1.2"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="28" r="1.5" fill="#99f6e4"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="46" r="1.2" fill="#7dd3fc"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="835" cy="34" r="1.4"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1138" cy="54" r="1.3" fill="#fde68a"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="235" cy="280" r="1.2" fill="#fb923c"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="645" cy="288" r="1.1" fill="#2dd4bf"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="885" cy="282" r="1.3" fill="#7dd3fc"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Left Animated NASA × Fire × Nile Orbital Emblem -->
  <g transform="translate(56, 66)">
    <circle cx="94" cy="94" r="88" fill="#060f20" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="94" cy="94" r="76" fill="none" stroke="#2dd4bf" stroke-opacity="0.14" stroke-dasharray="4 6"/>
    <!-- Inclined Satellite Orbit + Moving Satellite -->
    <g transform="rotate(-24 94 94)">
      <ellipse cx="94" cy="94" rx="82" ry="34" fill="none" stroke="url(#triadBar)" stroke-width="2" stroke-dasharray="6 5" opacity="0.78"/>
      <circle r="5.5" fill="#38bdf8" filter="url(#glowSoft)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M 176 94 A 82 34 0 1 1 12 94 A 82 34 0 1 1 176 94"/>
      </circle>
    </g>
    <!-- Thermal Flame -->
    <path d="M94 26c15 24-12 36 0 58 9-12 15-20 15-31 18 15 27 34 27 52a42 42 0 0 1-84 0c0-16 9-29 21-41 0 15 7 25 16 28-9-24 3-45 5-66Z" fill="url(#flameGrad)" filter="url(#glowSoft)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M94 67c7 12-5 18 0 31 6-6 9-11 9-16 8 7 12 16 12 26a21 21 0 0 1-42 0c0-9 5-16 11-22 0 8 3 12 8 15-4-12 1-23 2-34Z" fill="#fef9c3" opacity="0.78"/>
    <!-- Flowing Nile Delta Branches inside Emblem -->
    <path d="M94 156V132m0 0c-10-8-24-11-40-9M94 132c10-8 24-11 40-9" fill="none" stroke="url(#nileGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M48 145c15-6 31-6 46 0s31 6 46 0" fill="none" stroke="#5eead4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Center Mission Typography -->
  <g transform="translate(276, 62)">
    <!-- Mission Kicker -->
    <circle cx="6" cy="10" r="4.5" fill="#fc3d21">
      <animate attributeName="r" values="3.8;5.2;3.8" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="19" y="14" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.2" fill="#38bdf8">
      NASA SPACE APPS 2026 <tspan fill="#64748b">·</tspan> <tspan fill="#2dd4bf">NILE DELTA EARTH OBSERVATION</tspan>
    </text>

    <!-- Main Title -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="58" font-weight="800" letter-spacing="-1.2" fill="#f8fafc">
      FIRMS <tspan fill="url(#titleGrad)">HARMONY</tspan>
    </text>

    <!-- Spectrum Divider -->
    <rect x="0" y="96" width="510" height="3.5" rx="2" fill="url(#triadBar)"/>

    <!-- Subtitle -->
    <text x="0" y="132" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19.5" font-weight="600" fill="#dbeafe">
      Unified MODIS &amp; VIIRS Active-Fire Intelligence · Delta Fire Calendar
    </text>
    <text x="0" y="159" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#94a3b8">
      Separating real Nile Delta burning trends from satellite sensor shifts (2000–2025)
    </text>

    <!-- Clean Telemetry Pills -->
    <g transform="translate(0, 180)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700">
      <rect x="0" y="0" width="166" height="28" rx="14" fill="#ff6b1a" fill-opacity="0.14" stroke="#ff6b1a" stroke-opacity="0.45"/>
      <text x="83" y="18.5" text-anchor="middle" fill="#fed7aa">MODIS 1 km · VIIRS 375 m</text>

      <rect x="178" y="0" width="162" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.13" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <text x="259" y="18.5" text-anchor="middle" fill="#99f6e4">48 Verified Archive Files</text>

      <rect x="352" y="0" width="146" height="28" rx="14" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="425" y="18.5" text-anchor="middle" fill="#bae6fd">−54.5% Held-Out MAE</text>
    </g>
  </g>

  <!-- Right Animated North-Up Nile Delta & Polar Satellite Sweep -->
  <g transform="translate(868, 22)">
    <rect x="0" y="0" width="302" height="276" rx="16" fill="#050c19" stroke="#38bdf8" stroke-opacity="0.22"/>
    <text x="16" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6" fill="#7dd3fc">NILE DELTA · NORTH-UP · 0.25°</text>
    <text x="286" y="24" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b">N ↑</text>

    <!-- Subtle Mediterranean Sea Tint & Coastline -->
    <path d="M 14 38 L 288 38 L 288 94 Q 248 74 205 64 Q 152 52 100 68 Q 52 84 14 102 Z" fill="#0ea5e9" fill-opacity="0.12"/>
    <path d="M 14 102 Q 52 84 100 68 Q 152 52 205 64 Q 248 74 288 94" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.8"/>

    <!-- Fertile Delta Fan Glow -->
    <path d="M 152 222 Q 112 162 96 72 Q 152 54 212 66 Q 190 156 152 222 Z" fill="#14b8a6" fill-opacity="0.11"/>

    <!-- Flowing Nile Stem, Rosetta (West) & Damietta (East) Branches -->
    <g fill="none" stroke-linecap="round">
      <path d="M 154 264 L 152 222 Q 118 166 96 72" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="6"/>
      <path d="M 152 222 Q 186 156 212 66" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="6"/>
      <path d="M 154 264 L 152 222 Q 118 166 96 72" stroke="#2dd4bf" stroke-width="2.2"/>
      <path d="M 152 222 Q 186 156 212 66" stroke="#2dd4bf" stroke-width="2.2"/>
      <!-- Animated River Current Shimmer -->
      <path d="M 154 264 L 152 222 Q 118 166 96 72" stroke="#ccfbf1" stroke-width="1.4" stroke-dasharray="6 14">
        <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 152 222 Q 186 156 212 66" stroke="#ccfbf1" stroke-width="1.4" stroke-dasharray="6 14">
        <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Pulsing Thermal Hotspot Detections in Delta -->
    <g filter="url(#glowSoft)">
      <circle cx="176" cy="112" r="13" fill="#ff6b1a" opacity="0.22"><animate attributeName="r" values="9;16;9" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="176" cy="112" r="5.5" fill="#fef08a"/>

      <circle cx="148" cy="134" r="10" fill="#f97316" opacity="0.24"><animate attributeName="r" values="7;13;7" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="148" cy="134" r="4.2" fill="#fb923c"/>

      <circle cx="192" cy="148" r="9" fill="#ea580c" opacity="0.24"><animate attributeName="r" values="6;11;6" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="192" cy="148" r="3.8" fill="#fbbf24"/>

      <circle cx="128" cy="110" r="8" fill="#f59e0b" opacity="0.2"><animate attributeName="r" values="5;10;5" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="128" cy="110" r="3.2" fill="#fdba74"/>
    </g>

    <!-- Animated Sun-Synchronous Polar Orbit Satellite Sweep -->
    <path id="deltaOrbit" d="M 218 264 L 122 38" fill="none" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="1.2" stroke-dasharray="4 5"/>
    <g>
      <circle r="8" fill="#38bdf8" fill-opacity="0.26"/>
      <circle r="3" fill="#e0f2fe" filter="url(#glowSoft)"/>
      <animateMotion dur="7s" repeatCount="indefinite" path="M 218 264 L 122 38"/>
    </g>

    <!-- Subtle Coordinate Labels -->
    <g font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#cbd5e1" opacity="0.82">
      <text x="58" y="88">Alexandria</text>
      <text x="218" y="72">Damietta</text>
      <text x="164" y="230">Cairo</text>
    </g>
  </g>
</svg>
